name: CI

# Integración continua mínima: instala el entorno de desarrollo y ejecuta la
# suite de pytest. No entrena modelos ni descarga datos: usa los artefactos
# versionados en datos/procesado y modelos/.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar los tests
        run: python -m pytest -q
